# Perfil PROD: MySQL. Definir las variables de entorno antes de arrancar.
#   DB_URL       ej: jdbc:mysql://localhost:3306/dulceesmeralda
#   DB_USERNAME
#   DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dulceesmeralda}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# En produccion: validar el esquema (crearlo con src/main/resources/db/schema.sql)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=true
