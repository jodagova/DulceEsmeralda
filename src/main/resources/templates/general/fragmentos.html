<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<!-- HEAD -->
<head th:fragment="head">
    <title>Dulce Esmeralda</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>

<!-- HEADER -->
<header th:fragment="header">
    <nav class="navbar navbar-expand-lg navbar-dark navbar-esmeralda">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">
                <i class="fa-solid fa-mug-saucer me-1"></i> Dulce Esmeralda
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/}">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/menu}">Menu</a></li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/admin}">Administracion</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="nav-link" th:href="@{/login}"><i class="fa-solid fa-right-to-bracket"></i> Ingresar</a>
                    </li>
                    <li class="nav-item d-flex align-items-center" sec:authorize="isAuthenticated()">
                        <span class="navbar-text me-2"><i class="fa-solid fa-user"></i>
                            <span sec:authentication="name"></span></span>
                        <form method="post" th:action="@{/logout}">
                            <button class="btn btn-sm btn-outline-light" type="submit">Salir</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<!-- FOOTER -->
<footer th:fragment="footer" class="footer-esmeralda mt-5 py-4">
    <div class="container">
        <div class="row gy-3">
            <div class="col-md-4">
                <h6 class="fw-bold">Dulce Esmeralda</h6>
                <p class="small mb-0" th:text="#{app.eslogan}">Cafe de especialidad y reposteria artesanal</p>
            </div>
            <div class="col-md-4">
                <h6 class="fw-bold">Contacto</h6>
                <p class="small mb-1">Email: hola@dulceesmeralda.com</p>
                <p class="small mb-0">Tel: +506 0000-0000</p>
            </div>
            <div class="col-md-4">
                <h6 class="fw-bold">Horario</h6>
                <p class="small mb-0">Lun a Sab · 7:00 - 19:00</p>
            </div>
        </div>
        <hr class="border-light">
        <p class="text-center small mb-0">&copy; 2026 Dulce Esmeralda. Todos los derechos reservados.</p>
    </div>
</footer>

</html>
