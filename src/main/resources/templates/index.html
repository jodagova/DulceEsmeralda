<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head th:replace="~{general/fragmentos :: head}"></head>
<body>

<header th:replace="~{general/fragmentos :: header}"></header>

<section class="hero-esmeralda text-center text-white d-flex align-items-center">
    <div class="container">
        <h1 class="display-5 fw-bold" th:text="#{app.nombre}">Dulce Esmeralda</h1>
        <p class="lead" th:text="#{app.eslogan}">Cafe de especialidad y reposteria artesanal</p>
        <a class="btn btn-light btn-lg mt-2" th:href="@{/menu}">Ver el menu</a>
    </div>
</section>

<main class="container my-5">

    <div th:if="${#lists.isEmpty(categorias)}" class="alert alert-info">
        Aun no hay categorias registradas. Ingresa como administrador para cargar el menu.
    </div>

    <h2 class="h4 mb-3">Categorias</h2>
    <div class="row g-3 mb-5">
        <div class="col-6 col-md-3" th:each="c : ${categorias}">
            <a class="text-decoration-none" th:href="@{'/menu/categoria/' + ${c.idCategoria}}">
                <div class="card h-100 text-center categoria-card">
                    <div class="card-body">
                        <i class="fa-solid fa-mug-hot fa-2x mb-2 text-esmeralda"></i>
                        <h3 class="h6 mb-0" th:text="${c.descripcion}">Cafe</h3>
                    </div>
                </div>
            </a>
        </div>
    </div>

    <h2 class="h4 mb-3">Destacados</h2>
    <div class="row g-4">
        <div class="col-12 col-sm-6 col-lg-4" th:each="p : ${destacados}">
            <div class="card h-100 producto-card">
                <div class="card-body">
                    <h3 class="h5" th:text="${p.nombre}">Producto</h3>
                    <p class="text-muted small" th:text="${p.descripcion}">Descripcion</p>
                    <p class="fw-bold text-esmeralda mb-0">
                        &#8353; <span th:text="${#numbers.formatDecimal(p.precio, 1, 'COMMA', 0, 'POINT')}">0</span>
                    </p>
                </div>
            </div>
        </div>
        <div class="col-12" th:if="${#lists.isEmpty(destacados)}">
            <p class="text-muted">Todavia no hay productos destacados.</p>
        </div>
    </div>
</main>

<footer th:replace="~{general/fragmentos :: footer}"></footer>
</body>
</html>
