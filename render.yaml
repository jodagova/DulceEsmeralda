# Blueprint de Render. Al conectar el repo, Render detecta este archivo
# y crea el servicio automaticamente.
services:
  - type: web
    name: dulce-esmeralda
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: dev
      - key: APP_ADMIN_USERNAME
        value: admin
      - key: APP_ADMIN_PASSWORD
        generateValue: true
